<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verenpaine">
<meta name="description" content="Verenpaineen seurantasovellus">
<title>Verenpaine</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Verenpaine%22%2C%22short_name%22%3A%22Verenpaine%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22start_url%22%3A%22.%22%7D">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #263348;
    --border: rgba(255,255,255,0.08);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --blue: #3b82f6;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --teal: #14b8a6;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 0 0 100px; }

  /* Header */
  .header { padding: 56px 20px 20px; background: linear-gradient(180deg, #1e293b 0%, var(--bg) 100%); }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: var(--blue); }
  .header p { font-size: 13px; color: var(--muted); margin-top: 3px; }

  /* Metrics row */
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 0 16px 20px; }
  .metric { background: var(--surface); border-radius: var(--radius-sm); padding: 12px; }
  .metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .metric-val { font-size: 20px; font-weight: 700; line-height: 1; }
  .metric-unit { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* Status badge */
  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-top: 4px; }
  .badge-normal { background: rgba(16,185,129,0.15); color: #10b981; }
  .badge-elevated { background: rgba(245,158,11,0.15); color: #f59e0b; }
  .badge-high { background: rgba(239,68,68,0.15); color: #ef4444; }
  .badge-low { background: rgba(20,184,166,0.15); color: #14b8a6; }

  /* Entry form */
  .section { padding: 0 16px 20px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; }
  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .input-group { display: flex; flex-direction: column; gap: 4px; }
  .input-group label { font-size: 11px; color: var(--muted); }
  .input-group input {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 18px; font-weight: 600; padding: 12px 14px;
    width: 100%; outline: none; transition: border-color 0.15s;
    -webkit-appearance: none; appearance: none;
  }
  .input-group input:focus { border-color: var(--blue); }
  .input-group input::placeholder { color: var(--muted); font-weight: 400; font-size: 16px; }
  .note-input { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; padding: 10px 14px; width: 100%; outline: none; margin-bottom: 12px; }
  .note-input:focus { border-color: var(--blue); }
  .note-input::placeholder { color: var(--muted); }
  .add-btn {
    width: 100%; padding: 14px; background: var(--blue); color: #fff;
    border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.2px;
  }
  .add-btn:active { opacity: 0.8; transform: scale(0.99); }
  .err { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }

  /* Chart */
  .chart-wrap { position: relative; width: 100%; height: 200px; }
  .legend { display: flex; gap: 16px; margin-bottom: 12px; }
  .legend span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* History */
  .history-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .history-item:last-child { border-bottom: none; }
  .history-bp { font-size: 20px; font-weight: 700; min-width: 90px; }
  .history-bp span { font-size: 13px; font-weight: 400; color: var(--muted); }
  .history-meta { flex: 1; }
  .history-time { font-size: 12px; color: var(--muted); }
  .history-note { font-size: 12px; color: var(--text); margin-top: 1px; }
  .history-pulse { font-size: 12px; color: var(--muted); text-align: right; }
  .del-btn { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1; }
  .del-btn:active { background: rgba(239,68,68,0.1); color: var(--red); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }

  /* Reference */
  .ref-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ref-table th { color: var(--muted); font-weight: 500; text-align: left; padding: 4px 0; font-size: 11px; }
  .ref-table td { padding: 5px 0; border-bottom: 1px solid var(--border); }
  .ref-table tr:last-child td { border-bottom: none; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>❤️ Veren<span>paine</span></h1>
    <p>Seuraa mittauksiasi helposti</p>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Viimeisin</div>
      <div class="metric-val" id="last-val" style="font-size:15px;">—</div>
      <div id="last-badge"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Ka. sys</div>
      <div class="metric-val" id="avg-sys">—</div>
      <div class="metric-unit">mmHg</div>
    </div>
    <div class="metric">
      <div class="metric-label">Mittauksia</div>
      <div class="metric-val" id="count">0</div>
      <div class="metric-unit">kpl</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Lisää mittaus</div>
    <div class="card">
      <div class="input-grid">
        <div class="input-group">
          <label>Yläpaine (sys)</label>
          <input type="number" id="sys" placeholder="120" inputmode="numeric">
        </div>
        <div class="input-group">
          <label>Alapaine (dia)</label>
          <input type="number" id="dia" placeholder="80" inputmode="numeric">
        </div>
        <div class="input-group">
          <label>Pulssi</label>
          <input type="number" id="pulse" placeholder="70" inputmode="numeric">
        </div>
        <div class="input-group">
          <label>Kellonaika</label>
          <input type="time" id="time" style="font-size:14px;font-weight:500;">
        </div>
      </div>
      <input class="note-input" type="text" id="note" placeholder="Huomio (vapaaehtoinen)">
      <button class="add-btn" onclick="addEntry()">＋ Lisää mittaus</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="section" id="chart-section" style="display:none;">
    <div class="section-title">Kehitys</div>
    <div class="card">
      <div class="legend">
        <span><span class="legend-dot" style="background:#3b82f6"></span>Systolinen</span>
        <span><span class="legend-dot" style="background:#10b981"></span>Diastolinen</span>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Historia</div>
    <div class="card" id="history-list">
      <div class="empty">Ei mittauksia vielä</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Viitearvot</div>
    <div class="card">
      <table class="ref-table">
        <tr><th>Luokka</th><th>Sys</th><th>Dia</th></tr>
        <tr><td><span class="badge badge-low">Matala</span></td><td>&lt; 90</td><td>&lt; 60</td></tr>
        <tr><td><span class="badge badge-normal">Normaali</span></td><td>&lt; 120</td><td>&lt; 80</td></tr>
        <tr><td><span class="badge badge-elevated">Kohonnut</span></td><td>120–129</td><td>&lt; 80</td></tr>
        <tr><td><span class="badge badge-high">Korkea 1</span></td><td>130–139</td><td>80–89</td></tr>
        <tr><td><span class="badge badge-high">Korkea 2</span></td><td>≥ 140</td><td>≥ 90</td></tr>
      </table>
    </div>
  </div>
</div>

<script>
let readings = JSON.parse(localStorage.getItem('bp_readings') || '[]');
let chart = null;

function now() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
document.getElementById('time').value = now();

function classify(sys, dia) {
  if (sys < 90 || dia < 60) return { label: 'Matala', cls: 'badge-low' };
  if (sys < 120 && dia < 80) return { label: 'Normaali', cls: 'badge-normal' };
  if (sys < 130 && dia < 80) return { label: 'Kohonnut', cls: 'badge-elevated' };
  if (sys < 140 || dia < 90) return { label: 'Korkea 1', cls: 'badge-high' };
  return { label: 'Korkea 2', cls: 'badge-high' };
}

function formatDate(ts) {
  const d = new Date(ts);
  return d.getDate() + '.' + (d.getMonth()+1) + '.' + ' klo ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function save() { localStorage.setItem('bp_readings', JSON.stringify(readings)); }

function addEntry() {
  const sys = parseInt(document.getElementById('sys').value);
  const dia = parseInt(document.getElementById('dia').value);
  const pulse = parseInt(document.getElementById('pulse').value) || null;
  const note = document.getElementById('note').value.trim();
  const timeVal = document.getElementById('time').value;
  const err = document.getElementById('err');
  if (!sys || !dia || sys < 60 || sys > 250 || dia < 40 || dia > 150) {
    err.textContent = 'Tarkista arvot: sys 60–250, dia 40–150 mmHg';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  const now = new Date();
  if (timeVal) { const [h,m] = timeVal.split(':'); now.setHours(+h, +m); }
  readings.push({ sys, dia, pulse, note, ts: now.getTime() });
  save();
  document.getElementById('sys').value = '';
  document.getElementById('dia').value = '';
  document.getElementById('pulse').value = '';
  document.getElementById('note').value = '';
  document.getElementById('time').value = (new Date().getHours()+'').padStart(2,'0')+':'+(new Date().getMinutes()+'').padStart(2,'0');
  render();
}

function deleteEntry(i) {
  if (confirm('Poistetaanko tämä mittaus?')) {
    readings.splice(i, 1);
    save();
    render();
  }
}

function render() {
  const n = readings.length;
  document.getElementById('count').textContent = n;
  if (n === 0) {
    document.getElementById('last-val').textContent = '—';
    document.getElementById('last-badge').innerHTML = '';
    document.getElementById('avg-sys').textContent = '—';
    document.getElementById('history-list').innerHTML = '<div class="empty">Ei mittauksia vielä</div>';
    document.getElementById('chart-section').style.display = 'none';
    return;
  }
  const last = readings[n-1];
  const cls = classify(last.sys, last.dia);
  document.getElementById('last-val').textContent = last.sys + '/' + last.dia;
  document.getElementById('last-badge').innerHTML = '<span class="badge ' + cls.cls + '">' + cls.label + '</span>';
  const avg = Math.round(readings.reduce((s,r)=>s+r.sys,0)/n);
  document.getElementById('avg-sys').textContent = avg;
  document.getElementById('history-list').innerHTML = readings.slice().reverse().map((r,ri) => {
    const i = n-1-ri;
    const rc = classify(r.sys, r.dia);
    return '<div class="history-item">' +
      '<div><div class="history-bp">' + r.sys + '<span>/' + r.dia + '</span></div>' +
      '<span class="badge ' + rc.cls + '">' + rc.label + '</span></div>' +
      '<div class="history-meta">' +
      '<div class="history-time">' + formatDate(r.ts) + '</div>' +
      (r.note ? '<div class="history-note">' + r.note + '</div>' : '') +
      '</div>' +
      '<div class="history-pulse">' + (r.pulse ? '♥ ' + r.pulse : '') + '</div>' +
      '<button class="del-btn" onclick="deleteEntry(' + i + ')">✕</button>' +
      '</div>';
  }).join('');
  document.getElementById('chart-section').style.display = 'block';
  const labels = readings.map(r => { const d=new Date(r.ts); return d.getDate()+'.'+(d.getMonth()+1)+'.'; });
  if (!chart) {
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Sys', data: readings.map(r=>r.sys), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)', tension: 0.35, pointRadius: 4, borderWidth: 2, pointBackgroundColor: '#3b82f6' },
          { label: 'Dia', data: readings.map(r=>r.dia), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.08)', tension: 0.35, pointRadius: 4, borderWidth: 2, pointBackgroundColor: '#10b981' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' }, suggestedMin: 50, suggestedMax: 180 }
        }
      }
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = readings.map(r=>r.sys);
    chart.data.datasets[1].data = readings.map(r=>r.dia);
    chart.update();
  }
}

render();
</script>
</body>
</html>
